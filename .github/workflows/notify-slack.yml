
name: Notify Slack

on:
  workflow_run:
    workflows: ["Unit Test Checks"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send test results to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          RESULT: ${{ github.event.workflow_run.conclusion }}
          EVENT_NAME: ${{ github.event.workflow_run.event }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          PR_URL: ${{ github.event.workflow_run.pull_requests[0].html_url }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          # Only notify for PR test runs.
          
          # Notify for both automatic PR checks and
          # tests dispatched by the Claude generator.
          if os.environ["EVENT_NAME"] not in ("pull_request", "workflow_dispatch"):
            print("Skipping unrelated event")
            raise SystemExit(0)


          result = os.environ["RESULT"]

          if result == "success":
              message = "ut generated, all tests passed"
          elif result == "failure":
              message = "ut generated, tests failing , please check"
          else:
              print(f"Skipping result: {result}")
              raise SystemExit(0)

          pr_url = os.environ.get("PR_URL", "")
          run_url = os.environ["RUN_URL"]

          if pr_url:
              message += f"\nPR: {pr_url}"

          message += f"\nTest results: {run_url}"

          payload = json.dumps({
              "channel": os.environ["SLACK_CHANNEL_ID"],
              "text": message
          }).encode("utf-8")

          request = urllib.request.Request(
              "https://slack.com/api/chat.postMessage",
              data=payload,
              headers={
                  "Authorization": "Bearer " + os.environ["SLACK_BOT_TOKEN"],
                  "Content-Type": "application/json; charset=utf-8"
              },
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              data = json.load(response)

          if not data.get("ok"):
              raise RuntimeError(
                  "Slack API error: " + data.get("error", "unknown")
              )

          print("Slack notification sent")
          PY
