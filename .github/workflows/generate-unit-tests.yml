
name: Generate Unit Tests

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number"
        required: true
        type: string

jobs:
  generate-tests:
    runs-on: ubuntu-24.04

    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Generate unit tests with Claude
        uses: anthropics/claude-code-base-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: "claude-sonnet-5"
          settings: |
            {
              "permissions": {
                "defaultMode": "acceptEdits"
              }
            }
          prompt: |
            Analyze src/shopping_cart.py.

            Generate pytest unit tests for calculate_shipping().

            Requirements:
            - Create tests only in tests/unit-tests/
            - Cover normal, boundary and invalid inputs
            - Do not modify src/ or any existing application code
            - Do not modify workflow files
            - Do not commit or push
            - Ensure tests can run with pytest
            - Do not create output.txt, logs, summaries, or temporary
              files inside the repository.
            - Only create files under tests/unit-tests/.

          max_turns: "10"
          allowed_tools: "Read,Glob,Grep,Write,Edit"
          
      - name: Inspect unexpected files
        if: always()
        run: |
          echo "Changed and untracked files:"
          git status --short --untracked-files=all

          echo "Inspecting output.txt metadata:"
          if [ -f output.txt ]; then
            ls -lh output.txt
            file output.txt
          fi
          
      - name: Clean Claude execution output
        run: |
          if [ -f output.txt ] && [ ! -L output.txt ]; then
            echo "Removing temporary Claude output"
            rm -- output.txt
          fi


      - name: Validate modified files
        run: |
          python - <<'PY'
          import subprocess
          import sys

          result = subprocess.run(
              ["git", "status", "--porcelain", "-uall"],
              capture_output=True,
              text=True,
              check=True,
          )

          for line in result.stdout.splitlines():
              path = line[3:]
              if not path.startswith("tests/unit-tests/"):
                  print(f"Unauthorized modification: {path}")
                  sys.exit(1)

          print("All changes are within tests/unit-tests/")
          PY

      - name: Run unit tests
        run: |
          python -m pytest tests/unit-tests/ -v

      - name: Upload generated tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-unit-tests
          path: tests/unit-tests/
          if-no-files-found: warn
