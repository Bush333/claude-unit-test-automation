
name: Generate Unit Tests

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number"
        required: true
        type: string
    
jobs:
  generate-tests:
    runs-on: ubuntu-24.04

    env:
      PYTHONDONTWRITEBYTECODE: "1"

    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install pytest
      
      - name: Fetch PR changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          gh api \
            "repos/${{ github.repository }}/pulls/$PR_NUMBER" \
            -H "Accept: application/vnd.github.v3.diff" \
            > "$RUNNER_TEMP/pr.diff"

          echo "PR diff downloaded"


      - name: Generate unit tests with Claude
        uses: anthropics/claude-code-base-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: "claude-sonnet-5"
          settings: |
            {
              "permissions": {
                "defaultMode": "acceptEdits"
              }
            }
          
          prompt: |
            You are an AI unit-test generation agent.

            Analyze the code in the currently checked-out pull request.

            Your task is to generate pytest unit tests ONLY for
            functionality added or modified by this pull request.

            Instructions:

            1. Inspect the application source code.
            2. Identify the new or modified functions in the PR.
            3. Generate unit tests for those functions.
            4. Cover normal, boundary, invalid, and edge cases.
            5. Use existing application behavior to determine
               expected test results.

            File restrictions:
            - Create test files ONLY inside tests/unit-tests/.
            - Do not modify application source code.
            - Do not modify GitHub workflow files.
            - Do not modify existing tests.
            - Do not create output.txt, logs, summaries,
              or temporary files inside the repository.
            - Do not commit or push changes.

            Test requirements:
            - Use pytest.
            - Name test files test_*.py.
            - Ensure tests can be discovered by pytest.
            - Generate meaningful assertions.
            - Do not generate placeholder tests.
            - If no testable changes are found, explain why.

          max_turns: "10"
          allowed_tools: "Read,Glob,Grep,Write,Edit"

          
      - name: Inspect unexpected files
        if: always()
        run: |
          echo "Changed and untracked files:"
          git status --short --untracked-files=all

          echo "Inspecting output.txt metadata:"
          if [ -f output.txt ]; then
            ls -lh output.txt
            file output.txt
          fi
          
      - name: Clean Claude execution output
        run: |
          if [ -f output.txt ] && [ ! -L output.txt ]; then
            echo "Removing temporary Claude output"
            rm -- output.txt
          fi


      - name: Validate modified files
        run: |
          python - <<'PY'
          import subprocess
          import sys

          result = subprocess.run(
              ["git", "status", "--porcelain", "-uall"],
              capture_output=True,
              text=True,
              check=True,
          )

          for line in result.stdout.splitlines():
              path = line[3:]
              if not path.startswith("tests/unit-tests/"):
                  print(f"Unauthorized modification: {path}")
                  sys.exit(1)

          print("All changes are within tests/unit-tests/")
          PY

      - name: Run unit tests
        run: |
          python -m pytest tests/unit-tests/ -v
      
      - name: Commit generated tests to PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys

          def git(*args):
              return subprocess.check_output(
                  ["git", *args], text=True
              ).strip()

          pr_number = os.environ["PR_NUMBER"]

          if not pr_number.isdecimal() or int(pr_number) < 1:
              sys.exit("Invalid PR number")

          pr = json.loads(subprocess.check_output(
              [
                  "gh", "api",
                  f"repos/{os.environ['REPO']}/pulls/{pr_number}"
              ],
              text=True
          ))

          if pr["state"] != "open":
              sys.exit("PR is not open")

          if pr["head"]["repo"]["full_name"] != os.environ["REPO"]:
              sys.exit("External fork PRs are not supported")

          branch = pr["head"]["ref"]
          expected_sha = pr["head"]["sha"]

          if git("rev-parse", "HEAD") != expected_sha:
              sys.exit("PR changed during test generation")

          changes = subprocess.check_output(
              ["git", "status", "--porcelain", "-uall"],
              text=True
          ).splitlines()

          for line in changes:
              path = line[3:]
              if not path.startswith("tests/unit-tests/"):
                  sys.exit(f"Unauthorized modification: {path}")

          subprocess.run(
              ["git", "add", "--", "tests/unit-tests/"],
              check=True
          )

          staged = git("diff", "--cached", "--name-only")

          if not staged:
              print("No new unit tests to commit")
              sys.exit(0)

          subprocess.run(
              ["git", "config", "user.name", "github-actions[bot]"],
              check=True
          )
          subprocess.run(
              [
                  "git", "config", "user.email",
                  "41898282+github-actions[bot]@users.noreply.github.com"
              ],
              check=True
          )

          subprocess.run(
              ["git", "commit", "-m", "test: add AI-generated unit tests"],
              check=True
          )

          subprocess.run(
              [
                  "git", "-c",
                  f"http.https://github.com/.extraheader=AUTHORIZATION: basic "
                  + __import__("base64").b64encode(
                      f"x-access-token:{os.environ['GH_TOKEN']}".encode()
                  ).decode(),
                  "push", "origin",
                  f"HEAD:refs/heads/{branch}",
                  "--force-with-lease=refs/heads/"
                  + branch + ":" + expected_sha
              ],
              check=True
          )

          print(f"Updated PR #{pr_number}")
          PY


      - name: Upload generated tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-unit-tests
          path: tests/unit-tests/
          if-no-files-found: warn
