
name: Slack Unit Test Trigger

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read
  actions: write

jobs:
  trigger:
    if: github.event.issue.title == 'generateUT'
    runs-on: ubuntu-latest

    steps:
      - name: Extract PR number and trigger tests
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          import re
          import json
          import subprocess
          import sys

          repo = os.environ["REPO"]
          body = os.environ.get("ISSUE_BODY", "")

          pattern = (
              r"https://github\.com/"
              + re.escape(repo)
              + r"/pull/([0-9]+)(?![0-9])"
          )

          match = re.search(pattern, body)

          if not match:
              sys.exit("No valid PR URL found in issue description.")

          pr_number = match.group(1)

          result = subprocess.run(
              [
                  "gh", "api",
                  f"repos/{repo}/pulls/{pr_number}",
                  "--jq", ".state"
              ],
              capture_output=True,
              text=True,
              check=True
          )

          if result.stdout.strip() != "open":
              sys.exit("PR must be open.")

          subprocess.run(
              [
                  "gh", "workflow", "run",
                  "generate-unit-tests.yml",
                  "--repo", repo,
                  "--ref", "main",
                  "-f", f"pr_number={pr_number}"
              ],
              check=True
          )

          print(f"Started unit tests for PR #{pr_number}")
          PY
